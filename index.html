<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Voice</title>
<style>
html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC", "Noto Sans TC", sans-serif; -webkit-text-size-adjust: 100%; }
.screen { position: fixed; inset: 0; display: none; }
.screen.active { display: flex; }
#setup { flex-direction: column; justify-content: center; gap: 20px; padding: 24px; box-sizing: border-box; max-width: 420px; margin: 0 auto; }
#setup label { font-size: 15px; color: #aaa; display: block; margin-bottom: 6px; }
#setup select, #setup button { width: 100%; font-size: 18px; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; -webkit-appearance: none; appearance: none; }
#startBtn { background: #fff; color: #000; font-weight: 600; border: none; margin-top: 8px; }
#startBtn:disabled { background: #333; color: #777; }
#msg { font-size: 15px; color: #e74c3c; line-height: 1.5; min-height: 1em; }
#perform { justify-content: center; align-items: center; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#dateText { font-size: min(18vw, 140px); font-weight: 600; letter-spacing: 0.02em; }
#dot { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: calc(env(safe-area-inset-left) + 12px); width: 10px; height: 10px; border-radius: 50%; background: #444; opacity: 0.85; }
#dot.green { background: #2ecc71; }
#dot.yellow { background: #f1c40f; }
#dot.red { background: #e74c3c; }
#tip { position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); text-align: center; font-size: 13px; color: #888; opacity: 0; transition: opacity 0.4s; }
#tip.show { opacity: 1; }
</style>
</head>
<body>
<div id="setup" class="screen active">
  <div>
    <label for="rangeSel">範圍</label>
    <select id="rangeSel"></select>
  </div>
  <div>
    <label for="resultSel">結果</label>
    <select id="resultSel"></select>
  </div>
  <div>
    <label for="langSel">語言</label>
    <select id="langSel">
      <option value="zh-HK">廣東話</option>
      <option value="zh-CN">普通話</option>
    </select>
  </div>
  <button id="startBtn">開始表演</button>
  <div id="msg"></div>
</div>
<div id="perform" class="screen">
  <div id="dot"></div>
  <div id="dateText"></div>
  <div id="tip"></div>
</div>
<script>
(function () {
'use strict';

// ================= 設定 =================
const CONFIRM_WORD = '非常好';
const DOUBLE_TAP_MS = 400;
const STORE_KEY = 'voice.settings';

// 對照表：總和 → 牌（S黑桃 H紅桃 D方塊 C梅花）
const CARD_TABLE = {
  2: '2S', 3: '5D', 4: '8C', 5: 'JH', 6: 'AS', 7: '4D', 8: '7C', 9: '10H', 10: 'KS',
  11: '3D', 12: '6C', 13: '9H', 14: 'QS', 15: '2D', 16: '5C', 17: '8H', 18: 'JS', 19: 'AD',
  20: '4C', 21: '7H', 22: '10S', 23: 'KD', 24: '3C', 25: '6H', 26: '9S', 27: 'QD', 28: '2C',
  29: '5H', 30: '8S', 31: 'JD', 32: 'AC', 33: '4H', 34: '7S', 35: '10D', 36: 'KC', 37: '3H',
  38: '6S', 39: '9D', 40: 'QC', 41: '2H', 42: '5S', 43: '8D'
};

// 牌代碼 → 搜尋字（例如 AS → 黑桃A）
const SUIT_NAME = { S: '黑桃', H: '紅桃', D: '方塊', C: '梅花' };
function cardToQuery(code) {
  const suit = code.slice(-1);
  const rank = code.slice(0, -1);
  return SUIT_NAME[suit] + rank;
}

// 名人名單：每個月一行，第 1 個係 1 號，如此類推（直接係 Google 搜尋字）

  ["Susan Boyle","Hans Christian Andersen","吳京","Robert Downey Jr.","Pharrell Williams","Paul Rudd","成龍","Robin Wright","Kristen Stewart","Mandy Moore",

  ["Wes Anderson","David Beckham","James Brown","Audrey Hepburn","Adele","George Clooney","Pyotr Ilyich Tchaikovsky","Enrique Iglesias","Billy Joel","Bono U2",

   "Notorious B.I.G.","Novak Djokovic","Joan Collins","張柏芝","Mike Myers","John Wayne","Christopher Lee","Kylie Minogue","John F. Kennedy","CeeLo Green",
   "Clint Eastwood"],
  // 6月（30）
  ["Marilyn Monroe","莫文蔚","迪麗熱巴","Angelina Jolie","Mark Wahlberg","陳綺貞","Liam Neeson","Kanye West","Johnny Depp","黃家駒",

   "Usain Bolt","Claude Debussy","譚詠麟","蕭亞軒","劉亦菲","黃渤","Aaron Paul","Johann Wolfgang von Goethe","謝霆鋒","Cameron Diaz",
   "Richard Gere"],
  // 9月（30）
  ["Jungkook BTS","Keanu Reeves","Charlie Sheen","Beyoncé","Freddie Mercury","Idris Elba","Queen Elizabeth I","Pink singer","楊洋 演員","馬雲",
   "Harry Connick Jr.","張國榮","Roald Dahl","Amy Winehouse","蔡依林","范冰冰","Hank Williams","Greta Garbo","Jimmy Fallon","張曼玉",
   "王俊凱","Tom Felton","Bruce Springsteen","Jim Henson","Will Smith","孫儷","劉德華","Brigitte Bardot","Enrico Fermi","吳彥祖"],
  // 10月（31）
  ["Julie Andrews","Mahatma Gandhi","Gwen Stefani","Susan Sarandon","肖戰","Le Corbusier","湯唯","Bruno Mars","John Lennon","梅艷芳",
   "金城武","Hugh Jackman","Jimin BTS","張震 演員","Friedrich Nietzsche","趙麗穎","Eminem","周迅","John Lithgow","Snoop Dogg",
   "古天樂","Ichiro Suzuki","李安 導演","Drake rapper","Pablo Picasso","郭富城","Theodore Roosevelt","Bill Gates","阮經天","Jun Ji-hyun",
   "Selina 任家萱"],
  // 11月（30）
  ["Aishwarya Rai","Marie Antoinette","林青霞","Matthew McConaughey","Bryan Adams","Emma Stone","Marie Curie","王源 TFBOYS","Carl Sagan","周慧敏",
   "Leonardo DiCaprio","Ryan Gosling","黃曉明","King Charles III","Shailene Woodley","Lisa Bonet","Martin Scorsese","Owen Wilson","Calvin Klein","Joe Biden",
   "陳偉霆","Song Hye-kyo","Miley Cyrus","Henri de Toulouse-Lautrec","Christina Applegate","Tina Turner","李小龍","易烊千璽","林志玲","Mark Twain"],
  // 12月（31）
  ["Bette Midler","Britney Spears","Ozzy Osbourne","Jin BTS","Walt Disney","五月天 阿信","Noam Chomsky","劉嘉玲","Judi Dench","Emily Dickinson",
   "黎明 歌手","Frank Sinatra","Taylor Swift","Nostradamus","Gustave Eiffel","Jane Austen","Pope Francis","Brad Pitt","Édith Piaf","Kylian Mbappé",
   "Samuel L. Jackson","Giacomo Puccini","Emperor Akihito","Satomi Ishihara","桂綸鎂","Jared Leto","Timothée Chalamet","Denzel Washington","Jude Law","Tiger Woods",
   "鞏俐"]
];

// ================= 數字解析 =================
const CN_DIGIT = { '零': 0, '〇': 0, '○': 0, '一': 1, '二': 2, '兩': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
function toHalfWidth(s) {
  return s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
}
function parseNum(raw) {
  let s = toHalfWidth(raw);
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  s = s.replace(/廿/g, '二十').replace(/卅/g, '三十');
  if (!/^[零〇○一二兩两三四五六七八九十]+$/.test(s)) return NaN;
  const i = s.indexOf('十');
  if (i === -1) {
    let n = 0;
    for (const c of s) n = n * 10 + CN_DIGIT[c];
    return n;
  }
  if (s.indexOf('十', i + 1) !== -1) return NaN;
  const L = s.slice(0, i), R = s.slice(i + 1);
  if (L.length > 1 || R.length > 1) return NaN;
  const tens = L ? CN_DIGIT[L] : 1;
  const ones = R ? CN_DIGIT[R] : 0;
  return tens * 10 + ones;
}

// ================= 範圍（聽乜嘢） =================
const DAYS_IN_MONTH = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const NUM = '[0-9０-９零〇○一二兩两三四五六七八九十廿卅]+';
const DATE_RE = new RegExp('(' + NUM + ')\\s*月\\s*(' + NUM + ')\\s*(?:日|號|号)', 'g');

const RANGES = {
  date: {
    label: '日子',
    parse(text) {
      let found = null, m;
      DATE_RE.lastIndex = 0;
      while ((m = DATE_RE.exec(text)) !== null) {
        const mo = parseNum(m[1]), d = parseNum(m[2]);
        // 日子要真實存在（2月29日都計）
        if (mo >= 1 && mo <= 12 && d >= 1 && d <= DAYS_IN_MONTH[mo - 1]) {
          found = { m: mo, d: d };
        }
      }
      return found;
    },
    format(item) { return item.m + '月' + item.d + '日'; }
  }
};

// ================= 結果（搜尋乜嘢） =================
const RESULTS = {
  card: {
    label: '撲克牌',
    query(item) {
      const code = CARD_TABLE[item.m + item.d];
      return code ? cardToQuery(code) : null;
    }
  },
  celeb: {
    label: '名人',
    query(item) {
      const list = CELEB[item.m - 1];
      return (list && list[item.d - 1]) || null;
    }
  }
};

// 檢查名人名單每個月數目啱唔啱
function checkCelebList() {
  for (let i = 0; i < 12; i++) {
    const n = CELEB[i] ? CELEB[i].length : 0;
    if (n !== DAYS_IN_MONTH[i]) {
      return '名人名單 ' + (i + 1) + '月 有 ' + n + ' 個，應該係 ' + DAYS_IN_MONTH[i] + ' 個。';
    }
  }
  return '';
}

// ================= 元素同狀態 =================
const $ = id => document.getElementById(id);
const els = {
  setup: $('setup'), perform: $('perform'), rangeSel: $('rangeSel'), resultSel: $('resultSel'),
  langSel: $('langSel'), startBtn: $('startBtn'), msg: $('msg'), dot: $('dot'),
  dateText: $('dateText'), tip: $('tip')
};
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

let settings = { range: 'date', result: 'card', lang: 'zh-HK' };
let active = false;
let redirecting = false;
let rec = null;
let committed = null;
let current = null;
let restartTimer = null;
let failCount = 0;
let fatal = false;
let statusColor = '';
let wakeLock = null;
let lastTap = 0;
let exitAt = 0;
let tipTimer = null;

// ================= 設定畫面 =================
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    if (s.range && RANGES[s.range]) settings.range = s.range;
    if (s.result && RESULTS[s.result]) settings.result = s.result;
    if (s.lang === 'zh-HK' || s.lang === 'zh-CN') settings.lang = s.lang;
  } catch (e) {}
}
function saveSettings() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch (e) {}
}
function fillSelect(sel, table) {
  for (const key in table) {
    const o = document.createElement('option');
    o.value = key;
    o.textContent = table[key].label;
    sel.appendChild(o);
  }
}
function initSetup() {
  fillSelect(els.rangeSel, RANGES);
  fillSelect(els.resultSel, RESULTS);
  loadSettings();
  els.rangeSel.value = settings.range;
  els.resultSel.value = settings.result;
  els.langSel.value = settings.lang;

  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const iosOtherBrowser = isIOS && /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  let problem = checkCelebList();
  if (!problem) {
    if (!window.isSecureContext) problem = '要用 https:// 開呢個網頁。';
    else if (iosOtherBrowser) problem = 'iPhone 請用 Safari 開呢個網頁。';
    else if (!SR) problem = isIOS
      ? '語音辨識用唔到。請用 Safari，並喺 設定 → 一般 → 鍵盤 開啟「聽寫」。'
      : '呢個瀏覽器唔支援語音辨識。iPhone 請用 Safari，Android 請用 Chrome。';
  }
  if (problem) { els.msg.textContent = problem; els.startBtn.disabled = true; }
  els.startBtn.addEventListener('click', startPerformance);
}

// ================= 表演流程 =================
function startPerformance() {
  if (Date.now() - exitAt < 600) return;
  settings.range = els.rangeSel.value;
  settings.result = els.resultSel.value;
  settings.lang = els.langSel.value;
  saveSettings();
  active = true; redirecting = false; fatal = false; failCount = 0; committed = null;
  setCurrent(null);
  els.setup.classList.remove('active');
  els.perform.classList.add('active');
  setStatus('yellow');
  startRecognition();
  requestWakeLock();
}
function exitPerformance() {
  if (!active) return;
  active = false; exitAt = Date.now();
  stopRecognition(); releaseWakeLock();
  committed = null; setCurrent(null); setStatus(''); hideTip();
  els.perform.classList.remove('active');
  els.setup.classList.add('active');
}
function setCurrent(item) {
  current = item;
  els.dateText.textContent = item ? RANGES[settings.range].format(item) : '';
}
function setStatus(color) { statusColor = color; els.dot.className = color; }

function handleTranscript(text) {
  const range = RANGES[settings.range];
  const parts = text.split(CONFIRM_WORD);
  let item = committed;
  for (let i = 0; i < parts.length; i++) {
    const found = range.parse(parts[i]);
    if (found) item = found;
    const followedByConfirm = i < parts.length - 1;
    if (followedByConfirm && item) { setCurrent(item); go(item); return; }
  }
  setCurrent(item);
}

// 收咪，然後即刻跳去 Google 圖片搜尋
function go(item) {
  if (redirecting) return;
  const q = RESULTS[settings.result].query(item);
  if (!q) return;
  redirecting = true;
  stopRecognition();
  location.replace('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q));
}

// ================= 語音辨識 =================
function startRecognition() {
  clearTimeout(restartTimer);
  if (!active || redirecting || rec) return;
  const r = new SR();
  r.lang = settings.lang; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
  let started = false;
  r.onstart = () => { if (rec !== r) return; started = true; failCount = 0; setStatus('green'); };
  r.onresult = (e) => {
    if (rec !== r || !active || redirecting) return;
    let text = '';
    for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    handleTranscript(text);
  };
  r.onerror = (e) => {
    if (rec !== r) return;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { fatal = true; setStatus('red'); }
    else if (e.error === 'audio-capture') { setStatus('red'); }
  };
  r.onend = () => {
    if (rec !== r) return;
    rec = null; committed = current;
    if (!active || redirecting) return;
    if (fatal) { setStatus('red'); return; }
    if (!started) failCount++;
    setStatus(failCount >= 3 ? 'red' : 'yellow');
    scheduleRestart();
  };
  rec = r;
  try { r.start(); }
  catch (err) { rec = null; failCount++; setStatus(failCount >= 3 ? 'red' : 'yellow'); scheduleRestart(); }
}
function scheduleRestart() {
  clearTimeout(restartTimer);
  restartTimer = setTimeout(startRecognition, failCount >= 3 ? 2000 : 250);
}
function stopRecognition() {
  clearTimeout(restartTimer);
  const r = rec; rec = null;
  if (r) { try { r.abort(); } catch (e) {} }
}

// ================= 保持屏幕開住 =================
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) { showTip(); return; }
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { showTip(); }
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}
function showTip() {
  els.tip.textContent = '保持屏幕開住失敗：請去 設定 → 螢幕顯示與亮度 → 自動鎖定 → 永不';
  els.tip.classList.add('show');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(hideTip, 4000);
}
function hideTip() { clearTimeout(tipTimer); els.tip.classList.remove('show'); }

// ================= 雙擊離開 / 單擊重試 =================
els.perform.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTap < DOUBLE_TAP_MS) { e.preventDefault(); lastTap = 0; exitPerformance(); return; }
  lastTap = now;
  if (active && statusColor === 'red') {
    stopRecognition(); fatal = false; failCount = 0; setStatus('yellow'); startRecognition();
  }
}, { passive: false });
els.perform.addEventListener('dblclick', (e) => { e.preventDefault(); exitPerformance(); });

// ================= 切換 App / 返回網頁 =================
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && active && !redirecting) {
    if (!wakeLock) requestWakeLock();
    if (!rec) startRecognition();
  }
});

// 由 Google 撳返回時，回到設定畫面
window.addEventListener('pageshow', (e) => {
  if (e.persisted) { redirecting = false; exitPerformance(); }
});

initSetup();
})();
</script>
</body>
</html>
